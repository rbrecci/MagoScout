<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061A2B">
<title>MagoScout: elenco</title>
<link rel="stylesheet" href="css/magoscout.css">
</head>
<body>

<header class="barra">
  <a class="bt-voltar" href="index.html" aria-label="Voltar" style="display:grid;place-items:center;text-decoration:none">‹</a>
  <h1>Elenco<small id="contagem">nenhum jogador</small></h1>
</header>

<main class="conteudo">
  <form id="form" autocomplete="off">
    <p class="secao-titulo" id="titulo-form">Novo jogador</p>

    <div class="dupla">
      <div class="campo">
        <label for="numero">Número</label>
        <input type="number" id="numero" inputmode="numeric" min="1" max="99" placeholder="10">
      </div>
      <div class="campo">
        <label for="posicao">Posição</label>
        <select id="posicao" required>
          <option value="goleiro">Goleiro</option>
          <option value="fixo">Fixo</option>
          <option value="ala" selected>Ala</option>
          <option value="pivo">Pivô</option>
        </select>
      </div>
    </div>

    <div class="campo">
      <label for="nome">Nome</label>
      <input type="text" id="nome" required maxlength="80" placeholder="Como você chama ele">
    </div>

    <button type="submit" class="bt-principal" id="salvar">Adicionar ao elenco</button>
    <button type="button" class="bt-secundario" id="cancelar" hidden>Cancelar edição</button>
  </form>

  <p class="secao-titulo">No elenco</p>
  <div class="lista" id="lista"></div>
</main>

<div class="aviso" id="aviso" role="status" aria-live="polite">
  <span id="aviso-texto"></span>
  <button type="button" id="aviso-desfazer" hidden>desfazer</button>
</div>

<script src="js/db.js"></script>
<script src="js/dados.js"></script>
<script src="js/elenco.js"></script>
</body>
</html>
